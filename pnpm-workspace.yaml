packages:
  - packages/*
  - examples/*
  # pgconductor-js is consumed from the pinned submodule (built to dist) until a version is published.
  - vendor/postgres-conductor/packages/pgconductor-js

allowBuilds:
  "@google/genai": false
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

catalog:
  "@earendil-works/chord": 1.0.0
  "@earendil-works/pi-ai": 1.0.0
  "@earendil-works/pi-durable": 1.0.0
  "@chat-adapter/github": 4.41.1
  "@chat-adapter/linear": 4.41.1
  "@chat-adapter/slack": 4.41.1
  "@chat-adapter/state-memory": 4.41.1
  "@chat-adapter/state-pg": 4.41.1
  "@chat-adapter/tests": 4.41.1
  "@slack/web-api": 8.2.0
  "@testcontainers/postgresql": 12.2.0
  "@types/node": 26.6.4
  chat: 4.41.1
  oxfmt: 0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  postgres: 3.4.7
  # pgconductor-js (vendored) dependencies
  "@opentelemetry/api": 1.9.0
  "@opentelemetry/sdk-trace-base": 1.30.1
  "@standard-schema/spec": 1.0.0
  expect-type: 1.2.2
  tsx: 4.23.15
  typebox: 1.3.27
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 4.1.11
  zod: 4.6.5

minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.0.0"
  - "@earendil-works/pi-ai@1.0.0"
  - "@earendil-works/pi-durable@1.0.0"
  - "@earendil-works/pi-telemetry@1.0.0"
  - "@types/node@26.6.4"
